[package]
name = "overtls-gui"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
# Install cargo-bundle: cargo install cargo-bundle
# macOS Usage: cargo bundle --package overtls-gui --format osx --target x86_64-apple-darwin
name = "overtls-gui"
identifier = "com.github.ssrlive.overtls-gui"
icon = ["assets/main.png"]
category = "Utility"
short_description = "A overtls-gui application for wxDragon"
long_description = """
A overtls-gui application for wxDragon that showcases the capabilities of the wxDragon framework.
It allows users to view images in various formats, demonstrating the integration of the wxDragon
framework with the Rust programming language.
"""

[dependencies]
bitflags = "2.11.0"
chrono = "0.4.44"
dirs = "6.0.0"
env_logger = "0.11.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.29"
overtls = { version = "0.3.7" }
qrcode = "0.14.1"
rqrr = "0.10.1"
run-as = { version = "1.2.5", default-features = false }
screen-shot = { version = "0.0.8" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socks-hub = "0.2.3"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
tun2proxy = { version = "0.7.19", default-features = false }
wxdragon = { path = "../wxDragon/rust/wxdragon" }

[build-dependencies]
embed-manifest = "1.5.0"
embed-resource = "3.0.6"
