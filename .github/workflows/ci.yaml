name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Prepare
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install --fix-missing libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libgdk-pixbuf2.0-dev libgtk-3-dev libxdo-dev libxmu-dev -y

    - name: Install cargo-bundle
      run: cargo install cargo-bundle --git https://github.com/burtonageo/cargo-bundle.git

    - name: Rustfmt
      if: ${{ !cancelled() }}
      run: cargo fmt -- --check
    - name: Clippy
      if: ${{ !cancelled() }}
      run: cargo clippy --all-features --release -- -D warnings
    - name: Build
      if: ${{ !cancelled() }}
      run: cargo build --verbose --all-features --all-targets --tests --examples --release
    - name: Test
      if: ${{ !cancelled() }}
      run: cargo test --verbose --all-features --release

    - name: Bundle (Linux .deb)
      if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
      run: cargo bundle --format deb --release

    - name: Bundle (macOS .app)
      if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
      run: cargo bundle --format osx --release

    - name: Bundle (Windows .msi)
      if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
      run: cargo bundle --format wxsmsi --release
