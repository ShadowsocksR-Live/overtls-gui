name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Can't support `aarch64-unknown-linux-gnu` building yet due to some dependency issues
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Prepare (Linux)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install --fix-missing -y libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libgdk-pixbuf2.0-dev libgtk-3-dev libxdo-dev libxmu-dev

    - name: Install cargo-bundle
      run: cargo install cargo-bundle --git https://github.com/burtonageo/cargo-bundle.git --rev 2580932

    - name: Build
      run: cargo build --release --verbose --all-features --target ${{ matrix.target }}

    - name: Bundle (Linux .deb)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        cargo bundle --format deb --release --target ${{ matrix.target }}
        mkdir -p artifact
        # cargo-bundle produces arch-specific deb names, find the correct one
        DEB_FILE=$(find target/${{ matrix.target }}/release/bundle/deb -name "*.deb")
        cp "$DEB_FILE" artifact/overtls-gui-${{ matrix.target }}.deb

    - name: Bundle (macOS .app)
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        cargo bundle --format osx --release --target ${{ matrix.target }}
        mkdir -p artifact
        hdiutil create -volname OverTLS-GUI -srcfolder target/${{ matrix.target }}/release/bundle/osx/overtls-gui.app -ov -format UDZO artifact/overtls-gui-${{ matrix.target }}.dmg

    - name: Build installer (Windows .msi)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: bash
      run: |
        cargo bundle --format wxsmsi --release --target ${{ matrix.target }}
        mkdir -p artifact
        cp target/${{ matrix.target }}/release/bundle/wxsmsi/bin/Release/overtls-gui.msi artifact/overtls-gui-${{ matrix.target }}.msi

    - name: Publish
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: artifact/*
